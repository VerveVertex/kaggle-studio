plugins { id 'com.android.application' }
android {
    namespace 'dev.wenyu.kagglestudio'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.wenyu.kagglestudio'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '0.3.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    signingConfigs {
        personal {
            storeFile rootProject.file('signing/studio-release.p12')
            storeType 'PKCS12'
            storePassword rootProject.file('signing/password.txt').text.trim()
            keyAlias 'studio-release'
            keyPassword rootProject.file('signing/password.txt').text.trim()
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.personal } }
}
