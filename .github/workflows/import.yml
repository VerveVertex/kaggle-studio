name: Import Kaggle Studio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Expand project files
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, stat, zipfile
          root = pathlib.Path.cwd()
          archive = root / 'kaggle-studio-github.zip'
          expected = '1f00cf96f68ec0d7fe5c14334c86e7ad5674226c4e668251e9264523e8138774'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Source ZIP differs. Upload the latest kaggle-studio-github.zip first.')
          if (root / 'android').exists() or (root / 'README.en.md').exists():
              raise SystemExit('Project already exists. Import stopped to preserve current files.')
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or path.parts[0] != 'kaggle-studio':
                      raise SystemExit('Invalid archive path.')
                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit('Unexpected symbolic link.')
                  rel = pathlib.Path(*path.parts[1:])
                  if item.is_dir() or not rel.parts:
                      continue
                  if rel.parts[0] == '.git':
                      raise SystemExit('Unexpected Git metadata.')
                  if rel.parts[:2] == ('.github', 'workflows'):
                      rel = pathlib.Path('docs/github-workflows') / (rel.name + '.txt')
                  target = root / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(item))
          print('Imported source and all six README translations.')
          print('Optional CI template: docs/github-workflows/verify.yml.txt')
          PY
      - name: Save source to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Import Kaggle Studio source and six README translations"
          git push origin HEAD:"$GITHUB_REF_NAME"
